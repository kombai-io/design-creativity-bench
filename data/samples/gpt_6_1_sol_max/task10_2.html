function status(j){if(!j.tech.length)return 'Unassigned';if(!today())return 'Scheduled';if(j.end<=10+1/3)return 'Completed';if(j.start<=10+1/3)return 'Onsite';return 'Scheduled'}

function openEmergencyAssign(){const j=getJob('em1'),eligible=techs.filter(t=>t.systems.includes('Chiller'));const options=(value)=>eligible.map(t=>`<option value="${t.id}" ${t.id===value?'selected':''}>${t.name}${t.id==='maya'?' · schedule conflict':''}</option>`).join('');openModal(j.tech.length?'Edit emergency assignment':'Assign emergency visit',`<div class="assignment-summary">${ic('bolt')}<div><h3>Northpoint Medical Center</h3><p>WO-2481 · Carrier 30XA chiller · Critical priority<br>${selectedDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · 11:00 AM–1:00 PM service window</p></div></div><div class="form-grid"><div class="field"><label for="lead-tech">Lead technician</label><select id="lead-tech">${options(j.tech[0]||'miguel')}</select></div><div class="field"><label for="support-tech">Supporting technician</label><select id="support-tech">${options(j.tech[1]||'jordan')}</select></div><div class="field"><label for="em-start">Scheduled start</label><input id="em-start" type="time" value="11:00" min="11:00" max="11:30"></div><div class="field"><label for="em-duration">Expected duration</label><input id="em-duration" value="90 minutes · 2 technicians" readonly></div></div><div class="fit-checks"><div class="fit-check">${ic('check-circle')}Both technicians are EPA 608 Universal certified.</div><div class="fit-check">${ic('truck')}Miguel: 12 min drive · Jordan: 18 min drive to the site.</div><div class="fit-check">${ic('box')}Pressure transducer and manifold are on Miguel’s van.</div><div class="fit-check">${ic('lock')}Dana Park is onsite 11:00 AM–1:00 PM for access.</div><div class="fit-check">${ic('calendar')}Fits both shifts and preserves afternoon visits.</div></div><div class="form-error" id="assignment-error"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmEmergency()">${ic('check')}Confirm assignment</button>`)}
function confirmEmergency(){const lead=$('lead-tech').value,support=$('support-tech').value,start=parseTime($('em-start').value),end=start+1.5;let error='';if(lead===support)error='Select two different technicians for this visit.';else if(![lead,support].includes('miguel'))error='Miguel must be on this team: the replacement sensor and manifold are on his van.';else if(start<11||end>13)error='Schedule this 90-minute visit inside the 11:00 AM–1:00 PM service window.';else if([lead,support].some(id=>jobs.some(j=>j.id!=='em1'&&j.tech.includes(id)&&j.start<end&&j.end>start)))error='One of these technicians has an overlapping visit. Miguel and Jordan both fit at 11:00 AM.';else if(start>11)error='An 11:00 AM start preserves Jordan’s travel buffer to Elm Street Bank. Please use the suggested start.';if(error){$('assignment-error').style.display='block';$('assignment-error').textContent=error;return}const j=getJob('em1');j.tech=[lead,support];j.start=start;j.end=end;selectedJob=null;closeModal();renderAll();toast('Northpoint Medical assigned to Miguel + Jordan, 11:00 AM–12:30 PM.')}
function resolveOverrun(){const w=getJob('w5'),c=getJob('w6');w.end=12.75;w.duration=165;w.replanned=true;c.start=13.25;c.end=14.75;c.riskFollow=false;selectedJob=null;renderAll();toast('Civic Center moved to 1:15 PM. Travel and onsite access both fit.')}
function unassignVisit(id){const j=getJob(id);j.tech=[];selectedJob=null;renderAll();toast(j.site+' moved to the dispatch queue.')}
function toInput(h){const min=Math.round(h*60);return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}
function parseTime(v){const parts=v.split(':').map(Number);return parts[0]+parts[1]/60}
function openEditAssignment(id){const j=getJob(id);openModal('Edit visit assignment',`<div class="assignment-summary">${ic('calendar')}<div><h3>${esc(j.fullSite)}</h3><p>${j.order} · ${j.system} · ${j.priority} priority<br>Service window: ${esc(j.window)}</p></div></div><div class="form-grid"><div class="field full"><label for="edit-tech">Assigned technician</label><select id="edit-tech">${techs.map(t=>`<option value="${t.id}" ${j.tech.includes(t.id)?'selected':''} ${t.systems.includes(j.system)?'':'disabled'}>${t.name} · ${t.territory}${t.systems.includes(j.system)?'':' · not qualified for '+j.system}</option>`).join('')}</select></div><div class="field"><label for="edit-start">Scheduled start</label><input id="edit-start" type="time" value="${toInput(j.start)}"></div><div class="field"><label for="edit-duration">Expected duration (minutes)</label><input id="edit-duration" type="number" min="30" max="300" step="15" value="${j.duration}"></div><div class="field full"><label>Site access</label><textarea readonly>${esc(j.access)}</textarea></div></div><div class="fit-checks"><div class="fit-check">${ic('check-circle')}Only technicians qualified for ${esc(j.system)} systems are available.</div><div class="fit-check">${ic('truck')}Allow at least 20 minutes of travel between appointments.</div></div><div class="form-error" id="edit-error"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEdit('${j.id}')">Save assignment</button>`)}
function saveEdit(id){const j=getJob(id),techId=$('edit-tech').value,t=getTech(techId),start=parseTime($('edit-start').value),duration=Number($('edit-duration').value),end=start+duration/60;let error='';if(!Number.isFinite(start)||duration<30||duration>300)error='Use a valid start time and a duration of 30–300 minutes.';else if(start<t.start||end>t.end)error='This visit must fit '+t.name+'’s '+shiftFmt(t.start)+'–'+shiftFmt(t.end)+' shift.';else if(jobs.some(other=>other.id!==id&&other.tech.includes(techId)&&other.start<end&&other.end>start))error='This time overlaps another assigned visit. Choose a different start or technician.';else if(id==='w6'&&(start<12.5||start>13.5))error='The Civic Center contact is only available for check-in from 12:30 to 1:30 PM.';else if(id==='w3'&&(start<13||end>16))error='Cedar Labs only allows access between 1:00 and 4:00 PM.';if(error){$('edit-error').textContent=error;$('edit-error').style.display='block';return}j.tech=[techId];j.start=start;j.end=end;j.duration=duration;selectedJob=id;closeModal();renderAll();toast(j.site+' assigned to '+t.name+' at '+fmt(start)+'.')}
function openTechnician(id){const t=getTech(id),list=techJobs(t);openModal(t.name,`<div class="tech-modal-head">${avatar(t)}<div><h3>${t.name}</h3><p>${t.territory} territory · ${t.specialty}</p></div></div><div class="tech-facts"><div><div class="meta-label">Working hours</div><div class="meta-value">${shiftFmt(t.start)}–${shiftFmt(t.end)}</div></div><div><div class="meta-label">Available capacity</div><div class="meta-value">${dur(capacityMinutes(t))} · ${list.length} visits assigned</div></div><div><div class="meta-label">Vehicle & contact</div><div class="meta-value">${t.van}<br>${t.phone}</div></div><div><div class="meta-label">Systems supported</div><div class="meta-value">${t.systems.join(', ')}</div></div></div><div class="detail-section"><div class="section-label">Certifications</div><div class="requirements">${t.certs.map(c=>`<span class="requirement">${c}</span>`).join('')}</div></div><div class="route-list"><div class="section-label">${selectedDate.toLocaleDateString('en-US',{month:'long',day:'numeric'})} · Assigned visits</div>${list.map(j=>`<div class="route-item"><span class="route-time">${range(j.start,j.end)}</span><span><strong>${esc(j.site)}</strong><small>${j.system} · ${j.type} · ${j.order}</small></span>${pillStatus(j)}</div>`).join('')}</div>`,`<button class="btn primary" onclick="closeModal()">Back to schedule</button>`)}
function openDataView(view){let body='',wide=false;if(view==='Work orders'){wide=true;body=`<p class="modal-subtitle">${jobs.length} visits for ${selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}. Select a work order to review its assignment.</p><table class="data-table"><thead><tr><th>WORK ORDER</th><th>CUSTOMER SITE</th><th>SCHEDULE</th><th>STATUS</th></tr></thead><tbody>${jobs.map(j=>`<tr data-job="${j.id}" onclick="closeModal();openDetails('${j.id}')" tabindex="0" onkeydown="if(event.key==='Enter'){closeModal();openDetails('${j.id}')}"><td><strong>${j.order}</strong><small>${j.type} · ${j.priority}</small></td><td>${esc(j.fullSite)}<small>${esc(j.address)}</small></td><td>${j.tech.length?range(j.start,j.end):esc(j.window)}<small>${j.tech.length?j.tech.map(id=>getTech(id).name).join(' + '):'Needs technician assignment'}</small></td><td>${pillStatus(j)}</td></tr>`).join('')}</tbody></table>`}else if(view==='Customer sites'){wide=true;body=`<p class="modal-subtitle">${jobs.length} commercial sites with visits on today's board. Access details are confirmed with onsite contacts.</p><table class="data-table"><thead><tr><th>SITE & ADDRESS</th><th>EQUIPMENT</th><th>ONSITE CONTACT</th><th>ACCESS</th></tr></thead><tbody>${jobs.map(j=>`<tr><td><strong>${esc(j.fullSite)}</strong><small>${esc(j.address)}, Chicago ${j.zip}</small></td><td>${j.system}<small>${esc(j.model.split(' · ')[0])}</small></td><td>${esc(j.contact.split(' · ')[0])}<small>${j.phone}</small></td><td><span class="pill ${j.restricted?'warning':'green'}">${j.restricted?'Restricted access':'Standard access'}</span><small>${esc(j.window)}</small></td></tr>`).join('')}</tbody></table>`}else if(view==='Technicians'){body=`<p class="modal-subtitle">5 technicians checked in across 4 service territories. Open a profile for working hours, certifications, and the day's route.</p>${techs.map(t=>`<div class="roster-item">${avatar(t)}<div class="roster-info"><strong>${t.name}</strong><p>${t.territory} · ${t.specialty}<br>${shiftFmt(t.start)}–${shiftFmt(t.end)} · ${dur(capacityMinutes(t))} open</p></div><button class="btn" onclick="openTechnician('${t.id}')">View profile ${ic('chevron-right')}</button></div>`).join('')}`}else if(view==='Parts & inventory'){wide=true;const parts=[['Carrier pressure transducer','CESO110063-02','3 units','Van 05 · Miguel Santos','Ready for Northpoint'],['24V compressor contactor','CTR02574','6 units','Van 01 · Alex Rivera','Available'],['MERV-13 filter sets','20 × 25 × 2 in','24 sets','Chicago warehouse','Available'],['Lochinvar ignition module','100208363','2 units','Van 04 · Sam Brooks','Allocated to Parkview'],['Digital manifold kits','Testo 557s','5 kits','Checked out · 5 technicians','In service'],['R-134a refrigerant','30 lb cylinder','4 cylinders','Chicago warehouse','Available']];body=`<p class="modal-subtitle">Critical parts and diagnostic equipment are accounted for. The Northpoint replacement sensor is already on Miguel's van.</p><table class="data-table"><thead><tr><th>PART / EQUIPMENT</th><th>QUANTITY</th><th>LOCATION</th><th>STATUS</th></tr></thead><tbody>${parts.map(p=>`<tr><td><strong>${p[0]}</strong><small>${p[1]}</small></td><td>${p[2]}</td><td>${p[3]}</td><td><span class="pill green">${p[4]}</span></td></tr>`).join('')}</tbody></table>`}else if(view==='Reports'){const assigned=jobs.filter(j=>j.tech.length),completed=jobs.filter(j=>status(j)==='Completed').length,minutes=assigned.reduce((s,j)=>s+(j.end-j.start)*60*j.tech.length,0),travel=techs.reduce((s,t)=>s+routes(t).reduce((a,r)=>a+r.minutes,0),0);body=`<p class="modal-subtitle">Workday snapshot · ${selectedDate.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p><div class="report-metrics"><div class="report-metric">Visits completed<strong>${completed} / ${jobs.length}</strong></div><div class="report-metric">Onsite hours booked<strong>${dur(minutes)}</strong></div><div class="report-metric">Travel protected<strong>${dur(travel)}</strong></div></div><div class="section-label">Technician workload · onsite + travel</div>${techs.map(t=>{const onsite=techJobs(t).reduce((s,j)=>s+(j.end-j.start)*60,0),drive=routes(t).reduce((s,r)=>s+r.minutes,0),load=Math.round((onsite+drive)/((t.end-t.start)*60)*100);return `<div class="load-item"><span>${t.name}</span><div class="load-track"><div class="load-fill" style="width:${load}%"></div></div><span class="load-value">${load}% · ${dur(onsite+drive)}</span></div>`}).join('')}<div class="detail-problem" style="margin-top:22px">${riskOpen()?'One schedule risk is open: the Westgate repair needs 45 more minutes. Rescheduling Civic Center to 1:15 PM keeps its onsite access window intact.':'The Westgate repair has been extended and Civic Center rescheduled within its access window.'}</div>`}openModal(view,body,`<button class="btn" onclick="closeModal()">Close</button>`,wide)}
function openNewVisit(){openModal('Create a site visit',`<p class="modal-subtitle">Add a visit to the workday. Unassigned visits go straight to the dispatch queue.</p><form id="new-visit-form" class="form-grid" onsubmit="event.preventDefault();saveNewVisit()"><div class="field full"><label for="new-site">Customer site</label><input id="new-site" name="site" value="Maple Square Offices" required></div><div class="field full"><label for="new-address">Site address</label><input id="new-address" name="address" value="950 W Washington Blvd" required></div><div class="field"><label for="new-type">Visit type</label><select id="new-type" name="type"><option>Repair</option><option>Maintenance</option><option>Emergency</option></select></div><div class="field"><label for="new-priority">Priority</label><select id="new-priority" name="priority"><option>High</option><option>Normal</option><option>Critical</option></select></div><div class="field"><label for="new-system">Equipment type</label><select id="new-system" name="system"><option>RTU</option><option>Chiller</option><option>Boiler</option><option>VRF</option></select></div><div class="field"><label for="new-duration">Expected duration (minutes)</label><input id="new-duration" name="duration" type="number" min="30" max="300" step="15" value="90" required></div><div class="field"><label for="new-window-start">Service window starts</label><input id="new-window-start" name="start" type="time" value="13:30" required></div><div class="field"><label for="new-window-end">Service window ends</label><input id="new-window-end" name="end" type="time" value="15:30" required></div><div class="field full"><label for="new-problem">Reported problem</label><textarea id="new-problem" name="problem" required>Second-floor rooftop unit is blowing warm air. Check compressor operation and electrical components.</textarea></div><div class="field"><label for="new-contact">Onsite contact</label><input id="new-contact" name="contact" value="Riley Bennett" required></div><div class="field"><label for="new-phone">Contact phone</label><input id="new-phone" name="phone" value="(312) 555-0183" required></div><div class="field full"><label for="new-parts">Replacement parts / equipment</label><input id="new-parts" name="parts" value="24V contactor + electrical diagnostic kit"></div></form><div class="form-error" id="new-error"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewVisit()">Create unassigned visit</button>`)}
function saveNewVisit(){const form=$('new-visit-form');if(!form.reportValidity())return;const d=new FormData(form),start=parseTime(d.get('start')),windowEnd=parseTime(d.get('end')),duration=Number(d.get('duration'));if(windowEnd<=start||start<7||windowEnd>18||duration>(windowEnd-start)*60){$('new-error').style.display='block';$('new-error').textContent='Choose a service window between 7:00 AM and 6:00 PM that fits the expected duration.';return}const n=jobs.length-15,id='new'+n,order='WO-'+(2481+n);jobs.push({id,order,site:d.get('site'),fullSite:d.get('site'),address:d.get('address'),zip:'60607',type:d.get('type'),system:d.get('system'),model:'Carrier commercial '+d.get('system')+' system',problem:d.get('problem'),priority:d.get('priority'),start,end:start+duration/60,window:fmt(start)+'–'+fmt(windowEnd),duration,tech:[],cert:d.get('system')==='Boiler'?'Illinois gas license':'EPA 608',parts:d.get('parts'),tools:'Electrical diagnostic kit',access:'Meet the onsite contact at reception during the service window.',contact:d.get('contact')+' · Site manager',phone:d.get('phone'),restricted:true});selectedJob=null;closeModal();renderAll();toast(order+' created and added to the dispatch queue.')}
function exportSchedule(){closePopovers();const rows=[['Date','Work order','Site','Address','Type','Priority','Technician','Start','End','Duration minutes'],...jobs.map(j=>[selectedDate.toLocaleDateString('en-US'),j.order,j.fullSite,j.address,j.type,j.priority,j.tech.map(id=>getTech(id).name).join(' + ')||'Unassigned',fmt(j.start),fmt(j.end),j.duration])];const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='fieldline-schedule-'+selectedDate.getFullYear()+'-'+(selectedDate.getMonth()+1)+'-'+selectedDate.getDate()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Daily schedule exported with '+jobs.length+' visits.')}
function openWorkspace(){openModal('Your workspaces',`<p class="modal-subtitle">Northstar Mechanical · Commercial service operations</p><div class="workspace-card"><div><strong>Chicago operations</strong><p>5 technicians · 4 territories · ${jobs.length} visits today</p></div><span class="pill green">Current workspace</span></div><div class="workspace-card"><div><strong>Evanston operations</strong><p>4 technicians · North Shore · 9 visits today</p></div><span class="pill blue">Managed by Dana</span></div><div class="workspace-card"><div><strong>Oak Brook operations</strong><p>3 technicians · Western suburbs · 8 visits today</p></div><span class="pill blue">Managed by Marcus</span></div>`,`<button class="btn primary" onclick="closeModal()">Continue in Chicago</button>`)}

document.addEventListener('click',e=>{if(!e.target.closest('.date-controls')&&!e.target.closest('.bell-wrap')&&!e.target.closest('.panel-head')&&!e.target.closest('.search-wrap'))closePopovers()});
document.addEventListener('keydown',e=>{const modalOpen=$('modal-backdrop').style.display==='flex';if(e.key==='Escape'){closePopovers();if(modalOpen)closeModal();return}if(modalOpen&&e.key==='Tab'){const items=[...$('modal').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(el=>!el.disabled&&el.offsetParent!==null),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}if(modalOpen||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='/'){e.preventDefault();$('global-search').focus()}else if(e.key.toLowerCase()==='n'){e.preventDefault();openNewVisit()}else if(e.key==='ArrowLeft'){e.preventDefault();changeDay(-1)}else if(e.key==='ArrowRight'){e.preventDefault();changeDay(1)}});
renderStats();renderBoard();renderQueue();renderCalendar();
