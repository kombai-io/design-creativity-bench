<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldline HVAC · Dispatch Console</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#eef1f5;--panel:#ffffff;--line:#e4e8ee;--line2:#eef1f5;
    --tx:#0f172a;--tx2:#5b6472;--tx3:#8a93a3;
    --pri:#2563eb;--pri-soft:#eef4ff;
    --red:#dc2626;--red-soft:#fdecec;
    --amber:#d97706;--amber-soft:#fdf3e3;
    --green:#059669;--green-soft:#e6f6ef;
    --violet:#7c3aed;--violet-soft:#f3effe;
    --radius:12px;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.08);
    font-size:13px;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--tx);min-width:1180px;overflow-x:auto;
  }
  body{display:flex;flex-direction:column;height:100vh}
  .ic{width:14px;height:14px;flex:none;vertical-align:-2px}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font:inherit;color:inherit}

  /* ---------- Top bar ---------- */
  .topbar{
    height:56px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 16px;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:220px}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;color:#fff}
  .brand .mark .ic{width:17px;height:17px}
  .brand .bt{font-weight:700;font-size:14.5px;letter-spacing:-.2px}
  .brand .bt span{font-weight:500;color:var(--tx2)}
  .brand .sub{font-size:10px;color:var(--tx3);letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
  .datenav{display:flex;align-items:center;gap:8px;margin:0 auto}
  .datenav .navbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx2);background:#fff}
  .datenav .navbtn[disabled]{opacity:.4;cursor:default}
  .datenav .dlabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .pill-tom{font-size:10px;font-weight:700;background:var(--pri-soft);color:var(--pri);padding:3px 8px;border-radius:20px;letter-spacing:.3px}
  .topright{display:flex;align-items:center;gap:10px;min-width:220px;justify-content:flex-end}
  .search{display:flex;align-items:center;gap:7px;background:var(--line2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:200px;color:var(--tx3)}
  .search input{border:none;outline:none;background:transparent;width:100%;font-size:12.5px;color:var(--tx)}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-weight:600;font-size:12px;border:1px solid transparent;transition:.15s}
  .btn.primary{background:var(--pri);color:#fff}
  .btn.primary:hover{background:#1d4fd8}
  .btn.primary[disabled]{background:#c7d2e5;cursor:default}
  .btn.ghost{border-color:var(--line);background:#fff;color:var(--tx2)}
  .btn.ghost:hover{border-color:#c9d2de;color:var(--tx)}
  .btn .badge{background:#fff;color:var(--pri);border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
  .iconbtn{position:relative;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
  .iconbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#334155;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .who{line-height:1.2}
  .who b{font-size:12px;display:block}
  .who span{font-size:10.5px;color:var(--tx3)}

  /* ---------- Alert strip ---------- */
  .alertstrip{flex:none;display:flex;gap:10px;padding:10px 16px 4px;overflow-x:auto}
  .acard{flex:none;width:400px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tx3);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;display:flex;flex-direction:column;gap:5px}
  .acard.crit{border-left-color:var(--red)}
  .acard.warn{border-left-color:var(--amber)}
  .acard.info{border-left-color:var(--pri)}
  .acard.done{border-left-color:var(--green)}
  .acard .atop{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px}
  .acard .atop .ic{width:15px;height:15px}
  .acard.crit .atop{color:var(--red)}
  .acard.warn .atop{color:var(--amber)}
  .acard.info .atop{color:var(--pri)}
  .acard.done .atop{color:var(--green)}
  .acard .abody{font-size:11.5px;color:var(--tx2);line-height:1.45}
  .acard .arow{display:flex;gap:8px;margin-top:2px}
  .btn.sm{padding:4px 10px;font-size:11px;border-radius:7px}
  .btn.danger{background:var(--red);color:#fff}
  .btn.danger:hover{background:#b91c1c}
  .btn.warnb{background:var(--amber);color:#fff}
  .btn.warnb:hover{background:#b45309}
  .btn.blueb{background:var(--pri);color:#fff}
  .acard.done{opacity:.75}

  /* ---------- Workspace ---------- */
  .workspace{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:12px;padding:10px 16px 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .phead{padding:11px 13px 9px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .phead .pt{font-weight:700;font-size:12.5px}
  .phead .ps{font-size:10.5px;color:var(--tx3)}
  .panel .scroll{flex:1;overflow-y:auto;min-height:0}

  /* ---------- Roster ---------- */
  .tcard{margin:8px 10px 0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;transition:.15s;background:#fff}
  .tcard:hover{border-color:#b9c6da}
  .tcard.sel{border-color:var(--pri);background:var(--pri-soft)}
  .tcard .trow{display:flex;align-items:center;gap:9px}
  .tcard .tav{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none}
  .tcard .tn{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .tcard .tr{font-size:10.5px;color:var(--tx3);margin-top:1px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.off{background:#cbd5e1}
  .tcard .tmeta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx2);margin-top:7px}
  .ubar{height:4px;border-radius:2px;background:var(--line2);margin-top:5px;overflow:hidden}
  .ubar i{display:block;height:100%;border-radius:2px}
  .tcard .tcerts{margin-top:6px;font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unassignedCard{margin:8px 10px 0;border:1px dashed #f1b3b3;background:#fff7f7;border-radius:10px;padding:9px 10px;cursor:pointer}
  .unassignedCard:hover{border-color:var(--red)}
  .unassignedCard .un{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;color:var(--red)}
  .unassignedCard .us{font-size:11px;color:var(--tx2);margin-top:3px;line-height:1.4}

  /* ---------- Board ---------- */
  .boardwrap{min-width:0}
  .boardhead{padding:9px 13px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px;background:#fff}
  .seg button.on{background:var(--pri-soft);color:var(--pri)}
  .legend{display:flex;align-items:center;gap:11px;font-size:10.5px;color:var(--tx2);flex-wrap:nowrap;overflow:hidden}
  .lg{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .bmeta{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}
  .bmeta b{color:var(--tx2)}
  .board-scroll{flex:1;overflow:auto;min-height:0;position:relative}
  .board-inner{min-width:900px}

  .ruler{display:flex;position:sticky;top:0;z-index:6;background:#fbfcfe;border-bottom:1px solid var(--line)}
  .ruler .rh{width:210px;flex:none;position:sticky;left:0;z-index:7;background:#fbfcfe;border-right:1px solid var(--line);padding:7px 12px;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
  .ruler .rt{flex:1;display:flex}
  .ruler .rc{flex:1;border-left:1px solid var(--line2);padding:7px 0 0 6px;font-size:10px;font-weight:600;color:var(--tx3)}

  .brow{display:flex;border-bottom:1px solid var(--line2);min-height:100px}
  .brow .rhead{width:210px;flex:none;position:sticky;left:0;z-index:5;background:#fff;border-right:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;cursor:pointer}
  .brow .rhead:hover{background:#fafbfd}
  .brow .rhead.sel{background:var(--pri-soft)}
  .brow .rhead .rav{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
  .rname{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px}
  .rrole{font-size:10px;color:var(--tx3);margin-top:1px}
  .rhours{font-size:10px;color:var(--tx2);margin-top:5px}
  .rhours b{color:var(--tx)}
  .rhead .mini{height:3px;border-radius:2px;background:var(--line2);margin-top:4px;overflow:hidden}
  .rhead .mini i{display:block;height:100%}
  .track{flex:1;position:relative;
    background-image:linear-gradient(90deg,var(--line2) 1px,transparent 1px),linear-gradient(90deg,#f6f8fb 1px,transparent 1px);
    background-size:calc(100%/11) 100%,calc(100%/22) 100%;}
  .track.dropok{background-color:#f4f8ff;box-shadow:inset 0 0 0 2px #bfd4ff}
  .offshift{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(15,23,42,.035) 0 6px,transparent 6px 12px);pointer-events:none}
  .shiftbar{position:absolute;top:0;height:4px;border-radius:0 3px 3px 0;opacity:.85;pointer-events:none}
  .dropline{position:absolute;top:0;bottom:0;width:2px;background:var(--pri);border-radius:2px;z-index:8;pointer-events:none}
  .dropline:before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--pri)}

  .job{position:absolute;border-radius:8px;border:1px solid;padding:4px 7px;overflow:hidden;cursor:grab;transition:box-shadow .15s,transform .15s;z-index:3}
  .job:hover{box-shadow:0 3px 8px rgba(15,23,42,.15);z-index:4}
  .job.dragging{opacity:.45}
  .job.selected{outline:2px solid var(--pri);outline-offset:1px;z-index:5}
  .job.warnb{border-color:var(--amber)!important;box-shadow:inset 0 0 0 1px var(--amber)}
  .job.l1{font-size:10px}
  .b-time{font-size:9.5px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
  .b-site{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .b-tags{display:flex;gap:4px;margin-top:3px;align-items:center;white-space:nowrap;overflow:hidden}
  .fi{display:inline-flex;color:inherit;opacity:.8}
  .fi .ic{width:11px;height:11px}
  .pilling{font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.4px}
  .p-emg{background:var(--red);color:#fff}
  .p-high{background:#ffedd5;color:#c2410c}
  .p-med{background:#dbeafe;color:#1d4ed8}
  .p-low{background:#e5e7eb;color:#4b5563}

  .t-emg{background:#fdecec;border-color:#f5c2c2;color:#991b1b}
  .t-rep{background:#fff3e8;border-color:#f8d5b8;color:#9a3412}
  .t-pm{background:#eaf2fe;border-color:#c5daf8;color:#1e40af}
  .t-diag{background:#f3effe;border-color:#ddd0f7;color:#5b21b6}
  .t-depot{background:#f1f3f6;border-color:#d7dde5;color:#4b5563}
  .assist{background-image:repeating-linear-gradient(45deg,rgba(220,38,38,.10) 0 6px,rgba(220,38,38,.18) 6px 12px);border-style:dashed;border-color:#f0a8a8}
  .ext{background:repeating-linear-gradient(45deg,rgba(234,88,12,.13) 0 6px,rgba(234,88,12,.27) 6px 12px);border:1px dashed #ea580c;color:#9a3412;cursor:pointer;font-size:10px;font-weight:700;display:flex;align-items:center;gap:5px;padding:4px 8px;z-index:2}
  .ext .ic{width:12px;height:12px}

  .tchip{position:absolute;top:47px;transform:translateY(-50%);height:17px;display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:9px;font-size:9.5px;font-weight:700;white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums}
  .tchip .ic{width:10px;height:10px}
  .tchip.ok{background:var(--green-soft);color:#047857;border:1px solid #bfe8d4}
  .tchip.bad{background:var(--red-soft);color:#b91c1c;border:1px solid #f2bdbd}

  .ulane .rhead{background:#fff8f8;border-right-color:#f3d8d8}
  .ulane .track{background-color:#fffafa}
  .ucard{width:300px;min-height:72px;border:1px dashed #ef9a9a;background:#fff;border-radius:10px;padding:7px 9px;box-shadow:var(--shadow);cursor:grab}
  .ucard .u1{display:flex;align-items:center;gap:6px}
  .ucard .u1 .pulse{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  .ucard .uc{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.3px}
  .ucard .u2{font-weight:700;font-size:12px;margin-top:2px}
  .ucard .u3{font-size:10.5px;color:var(--tx2);margin-top:2px;line-height:1.35}
  .ucard .u4{display:flex;gap:6px;margin-top:5px;align-items:center}
  .slachip{font-size:9.5px;font-weight:800;background:var(--red);color:#fff;border-radius:5px;padding:2px 6px;letter-spacing:.3px}
  .linkbtn{font-size:10.5px;font-weight:700;color:var(--pri);display:inline-flex;align-items:center;gap:4px}
  .linkbtn:hover{text-decoration:underline}
  .draghint{font-size:9.5px;color:var(--tx3);margin-left:auto;display:flex;align-items:center;gap:4px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}

  /* ---------- List view ---------- */
  .listwrap{padding:6px 13px 14px}
  .lsec{margin-top:12px}
  .lsec h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .lrow{display:grid;grid-template-columns:100px minmax(0,1fr) 92px 58px 92px 110px;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;background:#fff}
  .lrow:hover{border-color:#b9c6da}
  .lrow.sel{border-color:var(--pri);background:var(--pri-soft)}
  .lrow .lt{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx2)}
  .lrow .ls{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .ls span{color:var(--tx3);font-weight:500}
  .typepill{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
  .lflags{display:flex;gap:5px;color:var(--tx3)}
  .lwin{font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;text-align:right}

  /* ---------- Details ---------- */
  .dhead{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:9px}
  .dkick{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3)}
  .dtitle{font-weight:800;font-size:14.5px;margin-top:2px;letter-spacing:-.2px}
  .dsub{font-size:11px;color:var(--tx2);margin-top:3px;line-height:1.4}
  .dbody{padding:12px 14px 18px}
  .drow{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:11.5px;align-items:flex-start}
  .drow:last-child{border-bottom:none}
  .drow .dl{width:92px;flex:none;color:var(--tx3);font-weight:600;display:flex;gap:5px;align-items:center;padding-top:1px}
  .drow .dv{flex:1;color:var(--tx);line-height:1.45}
  .drow .dv .muted{color:var(--tx3)}
  .chiprow{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:var(--line2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
  .chip .ic{width:11px;height:11px}
  .chip.hot{background:var(--red-soft);border-color:#f3c1c1;color:#b91c1c}
  .chip.blue{background:var(--pri-soft);border-color:#c8dbfa;color:var(--pri)}
  .chip.green{background:var(--green-soft);border-color:#bfe8d4;color:#047857}
  .chip.amber{background:var(--amber-soft);border-color:#f2d9ab;color:#b45309}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .kpi .kv{font-size:19px;font-weight:800;letter-spacing:-.4px}
  .kpi .kl{font-size:10px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
  .kpi.alert .kv{color:var(--red)}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .card h5{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .wx{display:flex;gap:10px;align-items:center}
  .wx .ic{width:22px;height:22px;color:var(--amber)}
  .wx .wt{font-weight:700;font-size:13px}
  .wx .ws{font-size:11px;color:var(--tx2);line-height:1.4;margin-top:1px}
  .attrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line2);cursor:pointer;font-size:11.5px;line-height:1.4}
  .attrow:last-child{border-bottom:none}
  .attrow .ic{width:13px;height:13px;margin-top:2px}
  .attrow.r .ic{color:var(--red)}.attrow.a .ic{color:var(--amber)}.attrow.b .ic{color:var(--pri)}
  .attrow:hover{color:var(--pri)}
  .caprow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
  .caprow .cn{width:96px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .caprow .cb{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
  .caprow .cb i{display:block;height:100%;border-radius:3px}
  .caprow .cv{width:58px;text-align:right;color:var(--tx3);font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .suggest{border:1px solid #f3c1c1;background:#fff7f7;border-radius:10px;padding:9px 11px;margin-top:11px}
  .suggest h6{font-size:11px;font-weight:800;color:var(--red);display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .suggest p{font-size:11px;color:var(--tx2);line-height:1.45}
  .nudge{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .nudge button{padding:6px 9px;font-size:11px;font-weight:700;color:var(--tx2);background:#fff;display:flex;align-items:center;gap:4px}
  .nudge button:hover{background:var(--line2)}
  select.mini{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11.5px;background:#fff;max-width:210px}

  /* ---------- Toasts ---------- */
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}

/* ============================ core logic ============================ */
function getOccupancy(techId){
  const out=[];
  jobs.forEach(j=>{
    if(j.techId===techId)out.push({start:j.start,end:j.end,eEnd:eEnd(j),job:j,assist:false});
    (j.assists||[]).forEach(a=>{if(a.techId===techId)out.push({start:a.start,end:a.end,eEnd:a.end,job:j,assist:true});});
  });
  return out.sort((a,b)=>a.start-b.start);
}
function bookedMin(t){
  let m=0;
  jobs.forEach(j=>{if(j.techId===t.id)m+=eEnd(j)-j.start;});
  jobs.forEach(j=>(j.assists||[]).forEach(a=>{if(a.techId===t.id)m+=a.end-a.start;}));
  return m;
}
function certGap(job,t){return (job.certs||[]).filter(c=>!(t.certs||[]).includes(c));}

function placeJob(job,techId,start){
  const t=T(techId);const end=start+job.dur;
  const occ=getOccupancy(techId).filter(o=>o.job!==job);
  const miss=certGap(job,t);
  if(miss.length)return{ok:false,msg:`${t.name} lacks ${miss.join(', ')} — required for this visit.`};
  if(job.sys&&!t.systems.includes(job.sys))return{ok:false,msg:`${t.name} is not set up to service ${job.sys} systems.`};
  const bad=occ.find(o=>start<o.eEnd&&end>o.start);
  if(bad)return{ok:false,msg:`Overlaps ${bad.job.site} (${fmtRange(bad.start,bad.eEnd)}).`};
  const warns=[];
  if(start<t.shift[0]||end>t.shift[1])warns.push('Outside shift hours ('+fmtRange(t.shift[0],t.shift[1])+')');
  if(job.win&&(start<job.win[0]||end>job.win[1]))warns.push('Outside service window '+fmtRange(job.win[0],job.win[1]));
  const prev=[...occ].reverse().find(o=>o.eEnd<=start);
  if(prev){const tv=travel(prev.job.zone,job.zone);if(prev.eEnd+tv>start)warns.push(`Tight travel from ${prev.job.site} (needs ${tv}m drive)`);}
  const next=occ.find(o=>o.start>=end);
  if(next){const tv=travel(job.zone,next.job.zone);if(end+tv>next.start)warns.push(`Not enough travel time to ${next.job.site} (needs ${tv}m drive)`);}
  pushHistory();
  const delta=start-(job.start??start);
  job.techId=techId;job.start=start;job.end=end;
  (job.assists||[]).forEach(a=>{a.start+=delta;a.end+=delta;});
  job.warn=warns;state.pending++;
  if(job.crew>1&&!(job.assists||[]).length)
    toast(`ok`,`Lead assigned at ${fmtT(start)}. 2-tech job — add an assist from the details panel.`,3600);
  else if(warns.length)toast('warn','Assigned with flags: '+warns[0],4200);
  else toast('ok',`${job.id} → ${t.name} at ${fmtT(start)}`,2800);
  return{ok:true};
}
function findSlot(techId,job){
  const t=T(techId);const occ=getOccupancy(techId).filter(o=>o.job!==job);
  let t0=Math.max(job.win?job.win[0]:DAY_START,t.shift[0],DAY_START);t0=snap(t0);
  for(let i=0;i<60;i++){
    const end=t0+job.dur;
    if(job.win&&end>job.win[1])return null;
    if(end>t.shift[1])return null;
    const bad=occ.find(o=>t0<o.eEnd&&end>o.start);
    if(!bad){
      const prev=[...occ].reverse().find(o=>o.eEnd<=t0);
      if(prev&&prev.eEnd+travel(prev.job.zone,job.zone)>t0){t0=snap(prev.eEnd+travel(prev.job.zone,job.zone));continue;}
      return t0;
    }
    t0=snap(Math.max(bad.eEnd,t0));
  }
  return null;
}
function pushHistory(){state.history.push(JSON.stringify(jobs));if(state.history.length>30)state.history.shift();updateHeader();}
function undo(){if(!state.history.length)return;jobs=JSON.parse(state.history.pop());state.pending=Math.max(0,state.pending-1);renderAll();toast('info','Last change undone.',2400);}
function unassign(job){pushHistory();job.techId=null;job.assists=[];state.pending++;renderAll();toast('info',`${job.id} returned to the unassigned queue.`,2600);}

function chipsHTML(occ){
  let html='';
  for(let i=0;i<occ.length-1;i++){

        ${drow('Address',esc(j.addr)+(t?`<div class="muted" style="margin-top:2px">${ic('truck')} ${travelPrev}</div>`:''),'pin')}
        ${drow('Duration',`${durTxt(j.dur)} planned${j.overrun?` · <b style="color:#c2410c">${durTxt(eEnd(j)-j.start)} revised</b>`:''}${travelNext!=='—'?`<div class="muted" style="margin-top:2px">${travelNext}</div>`:''}`,'clock')}
        ${drow('Equipment',esc(j.sys||'—')+(j.id==='REP-2240'?' · RTU-3, 20-ton packaged':'')),''}
        ${drow('Reported',esc(j.problem),'info')}
        ${drow('Parts',j.parts&&j.parts.length?`<div class="chiprow">${j.parts.map(p=>`<span class="chip">${ic('box')}${esc(p)}</span>`).join('')}</div>`:'<span class="muted">None required</span>','box')}
        ${drow('Crew & tools',(j.crew>1?`<span class="chip amber">${ic('users')}2-tech crew required</span> `:'')+`<div class="chiprow" style="margin-top:4px">${(j.tools||[]).map(x=>`<span class="chip">${ic('wrench')}${esc(x)}</span>`).join('')||'<span class="muted">Standard kit</span>'}</div>`,'wrench')}
        ${drow('Certifications',j.certs&&j.certs.length?`<div class="chiprow">${j.certs.map(c=>{
            const okT=t&&t.certs.includes(c);
            return `<span class="chip ${t?(okT?'green':'hot'):'blue'}">${ic(okT?'check':'shield')}${esc(c)}${t?(okT?' ✓':' — '+esc(t.name)+' lacks'):' required'}</span>`;}).join('')}</div>`:'<span class="muted">None</span>','award')}
        ${drow('Site access',j.access?`${esc(j.access.note)}${j.access.contact?`<div class="chiprow" style="margin-top:5px"><span class="chip blue">${ic('user')}${esc(j.access.contact.name)} · ${esc(j.access.contact.role)}</span><button class="chip" data-act="call" data-name="${esc(j.access.contact.name)}" data-phone="${esc(j.access.contact.phone)}">${ic('phone')}${esc(j.access.contact.phone)}</button></div>`:''}`:'<span class="muted">Standard access</span>','lock')}
        ${drow('Assigned',t?`${esc(t.name)} (${fmtT(t.shift[0])}–${fmtT(t.shift[1])})${assists?`<div class="chiprow" style="margin-top:5px">${assists}</div>`:''}${needAssist?`<div style="margin-top:6px;color:#b45309;font-weight:700;font-size:11px">${ic('users')} 2-tech job — add an assist:</div><select class="mini" data-act="assist" data-job="${j.id}" style="margin-top:4px"><option value="">Choose assist tech…</option>${TECHS.filter(x=>x.id!==t.id&&x.systems.includes(j.sys||'RTU')).map(x=>`<option value="${x.id}">${x.name} — ${x.role}</option>`).join('')}</select>`:''}`
          :`<b style="color:var(--red)">Not yet dispatched</b> — drag the card to a tech row, or assign below.`,'users')}
        ${j.note?drow('Note',esc(j.note),'info'):''}
      </div>
      ${!j.techId&&j.id==='EMG-0417'?`<div class="suggest"><h6>${ic('zap')} Recommended dispatch</h6>
        <p><b>Luis F. (lead) + Tom A. (assist 11:00–12:15), on-site 11:00 AM</b> — inside the SLA window. Luis is ~10 min away at Airport Logistics Hub; his tower PM gets cut short, Willow PM moves to on-call Ava R.</p>
        <div class="actions" style="margin-top:8px"><button class="btn danger sm" data-act="applySuggest">${ic('zap')}Apply recommended dispatch</button></div></div>`:''}
      ${j.techId?`<div class="actions">
        <span class="nudge"><button data-act="nudge" data-job="${j.id}" data-d="-15">${ic('minus')}15m</button><button data-act="nudge" data-job="${j.id}" data-d="15">+15m ${ic('plus')}</button></span>
        <button class="btn ghost" data-act="unassign" data-job="${j.id}">${ic('x')}Unassign</button>
        <button class="btn ghost" data-act="openTech" data-tech="${t.id}">View ${esc(t.name.split(' ')[0])}'s day ${ic('arrow-r')}</button>
      </div>`:`<div class="actions">
        <select class="mini" data-act="assign" data-job="${j.id}"><option value="">Assign to technician…</option>
          ${TECHS.map(x=>{const miss=certGap(j,x);const sysOK=!j.sys||x.systems.includes(j.sys);
            return `<option value="${x.id}" ${miss.length||!sysOK?'disabled':''}>${x.name}${miss.length?' — needs '+miss[0]:!sysOK?' — no '+j.sys:''}</option>`;}).join('')}
        </select></div>`}
    </div>`;
}
function renderTechView(el,t){
  const booked=bookedMin(t),shiftMin=t.shift[1]-t.shift[0],pctB=Math.min(100,Math.round(booked/shiftMin*100));
  const list=jobs.filter(j=>j.techId===t.id).sort((a,b)=>a.start-b.start);
  const ass=jobs.filter(j=>(j.assists||[]).some(a=>a.techId===t.id));
  el.innerHTML=`
    ${backBar('Technician profile',esc(t.name))}
    <div class="dbody">
      <div class="chiprow" style="margin-bottom:6px">
        <span class="chip" style="border-color:${t.color};color:${t.color}">${ic('user')}${esc(t.role)}</span>
        ${t.oncall?`<span class="chip amber">${ic('clock')}On call · from depot</span>`:`<span class="chip green">${ic('check')}On shift</span>`}
      </div>
      ${drow('Shift',fmtT(t.shift[0])+' – '+fmtT(t.shift[1]),'clock')}
      ${drow('Territory',t.terr.join(', '),'pin')}
      ${drow('Certifications',`<div class="chiprow">${t.certs.map(c=>`<span class="chip blue">${ic('award')}${esc(c)}</span>`).join('')}</div>`,'award')}
      ${drow('Services systems',`<div class="chiprow">${t.systems.map(c=>`<span class="chip">${ic('wind')}${esc(c)}</span>`).join('')}</div>`,'wind')}
      ${drow('Van equipment',`<div class="chiprow">${t.van.map(c=>`<span class="chip">${ic('box')}${esc(c)}</span>`).join('')}</div>`,'truck')}
      <div class="card"><h5>Capacity — ${durTxt(booked)} of ${durTxt(shiftMin)} booked</h5>
        <div class="ubar" style="height:7px"><i style="width:${pctB}%;background:${pctB>85?'var(--red)':pctB>70?'var(--amber)':'var(--pri)'}"></i></div>
        <div style="font-size:10.5px;color:var(--tx3);margin-top:5px">${pctB}% of shift committed${t.oncall?' · on-call standby':' · '+list.length+' visit'+(list.length===1?'':'s')}</div></div>
      <div class="card"><h5>Today's route</h5>
        ${list.length?list.map(j=>`<div class="attrow" data-open="${j.id}">${ic('arrow-r','color:'+t.color)}<div><b>${fm(j.start)}–${fm(eEnd(j))}</b> · ${esc(j.site)} <span style="color:var(--tx3)">· ${TYPE[j.type].l} · ${PRI[j.pri].l}</span>${j.warn&&j.warn.length?`<div style="color:#b45309;font-size:10.5px">${ic('alert')} ${esc(j.warn[0])}</div>`:''}</div></div>`).join(''):'<div style="font-size:11.5px;color:var(--tx3)">No visits assigned — available capacity.</div>'}
        ${ass.length?ass.map(j=>{const a=j.assists.find(x=>x.techId===t.id);return `<div class="attrow" data-open="${j.id}">${ic('users','color:#b91c1c')}<div><b>${fm(a.start)}–${fm(a.end)}</b> · Assist: ${esc(j.site)} <span style="color:var(--tx3)">· for ${esc(tName(j.techId))}</span></div></div>`;}).join(''):''}
      </div>
    </div>`;
}
function renderOverview(el){
  const visits=jobs.filter(j=>j.type!=='depot');
  const un=jobs.filter(j=>!j.techId&&j.type!=='depot');
  const util=Math.round(TECHS.reduce((s,t)=>s+bookedMin(t)/(t.shift[1]-t.shift[0]),0)/TECHS.length*100);
  const att=[];
  un.forEach(j=>att.push({c:'r',i:'zap',txt:`<b>${esc(j.site)}</b> — emergency unassigned, SLA ${fmtT(j.win[0])}`,id:j.id}));
  jobs.filter(j=>j.overrun).forEach(j=>att.push({c:'a',i:'alert',txt:`<b>${esc(j.site)}</b> — revised ETA ${fmtT(eEnd(j))} (+${j.overrun}m)`,id:j.id}));
  jobs.filter(j=>j.warn&&j.warn.length).forEach(j=>att.push({c:'a',i:'alert',txt:`<b>${esc(j.site)}</b> — ${esc(j.warn[0])}`,id:j.id}));
  if(J('REP-3102').start<810)att.push({c:'b',i:'lock',txt:`<b>City Hall Annex</b> — escort confirmed 1:30 PM, job starts ${fmtT(J('REP-3102').start)}`,id:'REP-3102'});
  const emg=J('EMG-0417');
  const zones=['North','Downtown','West','South','Airport'].map(z=>{
    const c=visits.filter(j=>j.zone===z).length;
    const ts=TECHS.filter(t=>t.terr.includes(z)).map(t=>t.name.split(' ')[1]).join(', ');
    return `<span class="chip">${ic('pin')}<b>${z}</b> · ${c} visit${c===1?'':'s'} · ${esc(ts||'none')}</span>`;}).join('');
  el.innerHTML=`
    <div class="dhead"><div style="min-width:0"><div class="dkick">Day overview</div><div class="dtitle">Tomorrow · Wed, Mar 12</div>
      <div class="dsub">${visits.length} site visits planned across 5 zones · ${un.length} unassigned · planning mode</div></div></div>
    <div class="dbody">
      <div class="kpis">
        <div class="kpi"><div class="kv">${visits.length}</div><div class="kl">Visits scheduled</div></div>
        <div class="kpi ${un.length?'alert':''}"><div class="kv">${un.length}</div><div class="kl">Unassigned</div></div>
        <div class="kpi"><div class="kv">${util}%</div><div class="kl">Fleet booked</div></div>
        <div class="kpi ${att.length?'alert':''}"><div class="kv">${att.length}</div><div class="kl">At risk / flagged</div></div>
      </div>
      <div class="card wx">${ic('sun')}<div><div class="wt">95°F · Heat advisory</div><div class="ws">Cooling call volume +20%. Rooftop work caution 12:00–4:00 PM — hydrate crews, watch RTU runtimes.</div></div></div>
      ${!emg.techId?`<div class="card" style="border-color:#f3c1c1;background:#fff7f7">
        <h5 style="color:var(--red)">${ic('zap')} SLA watch — Cornerstone Data Center</h5>
        <div style="font-size:11.5px;color:var(--tx2);line-height:1.5">Qualified tech must be on-site by <b>10:00 AM</b>. Requires EPA 608 Universal, recovery rig and a 2-tech crew. <button class="linkbtn" data-open="EMG-0417">Open emergency call ${'→'}</button></div></div>`
      :`<div class="card" style="border-color:#bfe8d4;background:var(--green-soft)"><h5 style="color:var(--green)">${ic('check')} Emergency crew dispatched</h5><div style="font-size:11.5px;color:#065f46">${esc(emg.site)} — on-site ${emg.start?fmtT(emg.start):''} · ${esc(tName(emg.techId))}${emg.assists.length?' + '+emg.assists.map(a=>tName(a.techId)).join(' & '):''}</div></div>`}
      <div class="card"><h5>${ic('alert')} Needs attention</h5>
        ${att.length?att.map(a=>`<div class="attrow ${a.c}" data-open="${a.id}">${ic(a.i)}<div>${a.txt}</div></div>`).join(''):'<div style="font-size:11.5px;color:var(--tx3)">No open issues — schedule looks clean.</div>'}
      </div>
      <div class="card"><h5>${ic('pin')} Coverage by zone</h5><div class="chiprow">${zones}</div></div>
      <div class="card"><h5>${ic('users')} Crew capacity</h5>
        ${TECHS.map(t=>{const b=bookedMin(t),p2=Math.min(100,Math.round(b/(t.shift[1]-t.shift[0])*100));
          return `<div class="caprow" data-techrow="${t.id}" style="cursor:pointer"><span class="cn">${esc(t.name)}${t.oncall?' <span style="color:var(--amber);font-size:9px;font-weight:800">ON CALL</span>':''}</span><span class="cb"><i style="width:${p2}%;background:${p2>85?'var(--red)':p2>70?'var(--amber)':'var(--pri)'}"></i></span><span class="cv">${durTxt(b)} / ${durTxt(t.shift[1]-t.shift[0])}</span></div>`;}).join('')}
      </div>
    </div>`;
}

function updateHeader(){
  const b=$('#pubBadge');b.textContent=state.pending;b.style.display=state.pending?'':'none';
  $('#btnPublish').disabled=!state.pending;
  $('#btnPublish').childNodes[1].textContent=state.pending?'Publish schedule · '+state.pending:'Schedule published ';
  $('#btnUndo').style.display=state.history.length?'':'none';
}
function renderBoardMeta(){
  const visits=jobs.filter(j=>j.type!=='depot');
  const un=visits.filter(j=>!j.techId).length;
  $('#boardMeta').innerHTML=`<b>${visits.length}</b> visits · <b style="color:${un?'var(--red)':'var(--green)'}">${un}</b> unassigned · <b>${TECHS.length}</b> techs on the board`;
}
function renderAll(){renderAlerts();renderRoster();renderBoard();renderDetails();renderBoardMeta();updateHeader();}

/* ============================ toast ============================ */
function toast(kind,msg,ms){
  const icn=kind==='err'?'x':kind==='warn'?'alert':kind==='ok'?'check':'info';
  const d=document.createElement('div');d.className='toast '+kind;d.innerHTML=ic(icn)+'<span>'+msg+'</span>';
  $('#toasts').appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='.3s';setTimeout(()=>d.remove(),320);},ms||3200);
}

/* ============================ events ============================ */
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  const open=e.target.closest('[data-open]');
  const tech=e.target.closest('[data-tech]');
  const techrow=e.target.closest('[data-techrow]');
  if(act){
    const a=act.dataset.act;
    if(a==='fixAlert'||a==='applySuggest'){
      const al=ALERTS.find(x=>x.id===(act.dataset.alert||'a1'));
      if(al.check()){renderAll();return;}
      pushHistory();const n=al.fix();state.pending+=n;al.snapshot=state.history[state.history.length-1];
      renderAll();toast('ok','Fix applied — '+n+' schedule change'+(n>1?'s':'')+' made. Review and publish.',3800);return;
    }
    if(a==='revertAlert'){
      const al=ALERTS.find(x=>x.id===act.dataset.alert);
      if(al&&al.snapshot){pushHistory();jobs=JSON.parse(al.snapshot);al.snapshot=null;renderAll();toast('info','Fix reverted.',2400);}return;
    }
    if(a==='reviewAlert'){const al=ALERTS.find(x=>x.id===act.dataset.alert);state.sel={kind:'job',id:al.review};renderAll();scrollJobIntoView(al.review);return;}
    if(a==='suggest'){state.sel={kind:'job',id:'EMG-0417'};renderAll();scrollJobIntoView('EMG-0417');toast('info','Recommended: Luis F. (lead) + Tom A. (assist) at 11:00 AM — see details panel.',4200);return;}
    if(a==='overview'){state.sel=null;renderAll();return;}
    if(a==='unassign'){unassign(J(act.dataset.job));return;}
    if(a==='nudge'){
      const j=J(act.dataset.job);const d=+act.dataset.d;pushHistory();
      const ns=j.start+d,occ=getOccupancy(j.techId).filter(o=>o.job!==j);
      if(occ.some(o=>ns<o.eEnd&&ns+j.dur>o.start)){state.history.pop();toast('err','That shift overlaps another visit — try a different slot.',3400);renderAll();return;}
      const warns=[];
      const t=T(j.techId);
      if(ns<t.shift[0]||ns+j.dur>t.shift[1])warns.push('Outside shift hours');
      if(j.win&&(ns<j.win[0]||ns+j.dur>j.win[1]))warns.push('Outside service window');
      j.start=ns;j.end=ns+j.dur;j.warn=warns;state.pending++;renderAll();
      toast(warns.length?'warn':'ok',j.id+' moved to '+fmtT(ns)+(warns.length?' — flag: '+warns[0]:''),3400);return;
    }
    if(a==='call'){toast('info','Calling '+act.dataset.name+' at '+act.dataset.phone+' … (demo)',2600);return;}
    if(a==='rmassist'){
      e.stopPropagation();const j=J(act.dataset.job);pushHistory();
      j.assists=j.assists.filter(x=>x.techId!==act.dataset.tech);state.pending++;
      renderAll();toast('info','Assist removed from '+tName(act.dataset.tech)+'.',2400);return;
    }
    if(a==='openTech'){state.sel={kind:'tech',id:act.dataset.tech};renderAll();return;}
  }
  if(open&&open.dataset.open){state.sel={kind:'job',id:open.dataset.open};renderAll();if(state.view==='timeline')scrollJobIntoView(open.dataset.open);return;}
  if(techrow){state.sel={kind:'tech',id:techrow.dataset.techrow};renderAll();return;}
  if(tech&&tech.dataset.tech){state.sel={kind:'tech',id:tech.dataset.tech};renderAll();return;}
  if(e.target.closest('.job')&&!state.didDrag){const jb=e.target.closest('.job');if(jb.dataset.job){state.sel={kind:'job',id:jb.dataset.job};renderAll();return;}}
  state.sel=null;renderAll();
});
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-act]');if(!s)return;
  const j=J(s.dataset.job);
  if(s.dataset.act==='assign'){
    if(!s.value)return;
    const start=findSlot(s.value,j);
    if(start==null){toast('err','No slot fits '+j.site+' inside '+tName(s.value)+'\u2019s shift and the service window.',4200);s.value='';return;}
    const res=placeJob(j,s.value,start);
    if(res.ok){state.sel={kind:'job',id:j.id};}
    renderAll();
  }
  if(s.dataset.act==='assist'){
    if(!s.value)return;
    const tech=T(s.value);const lead=T(j.techId);
    const occ=getOccupancy(s.value);
    if(occ.some(o=>j.start<o.eEnd&&eEnd(j)>o.start)){toast('err',tech.name+' is busy during that window — overlaps '+occ.find(o=>j.start<o.eEnd&&eEnd(j)>o.start).job.site+'.',3800);s.value='';return;}
    pushHistory();
    j.assists=j.assists||[];j.assists.push({techId:s.value,start:j.start,end:Math.min(eEnd(j),j.start+90)});
    state.pending++;renderAll();
    toast('ok',tech.name+' added as assist ('+fm(j.start)+'–'+fm(Math.min(eEnd(j),j.start+90))+').',3200);
  }
});
$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();renderBoard();});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
  state.view=b.dataset.view;renderBoard();
}));
$('#btnUndo').addEventListener('click',undo);
$('#btnPublish').addEventListener('click',()=>{
  if(!state.pending){toast('info','No pending changes to publish.',2200);return;}
  state.pending=0;state.history=[];ALERTS.forEach(a=>a.snapshot=null);
  updateHeader();toast('ok','Schedule published — 6 technicians notified via mobile app.',3600);
});
$('#btnBell').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});toast('info',$('#bellDot').textContent+' active alert(s) shown in the alert strip.',2600);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.sel=null;renderAll();}});

/* drag & drop */
const boardEl=$('#board'),scrollEl=$('#boardScroll');
let dropLine=null;
boardEl.addEventListener('dragstart',e=>{
  const jb=e.target.closest('.job[draggable="true"]');if(!jb)return;
  state.dragId=jb.dataset.job;state.didDrag=true;
  e.dataTransfer.setData('text/plain',state.dragId);
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>jb.classList.add('dragging'),0);
});
boardEl.addEventListener('dragend',e=>{
  boardEl.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
  clearDrop();state.dragId=null;setTimeout(()=>state.didDrag=false,80);
});
boardEl.addEventListener('dragover',e=>{
  const track=e.target.closest('.track');if(!track||!state.dragId)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  boardEl.querySelectorAll('.track.dropok').forEach(x=>x.classList.remove('dropok'));
  track.classList.add('dropok');
  const rect=track.getBoundingClientRect();
  const m=Math.min(DAY_END,Math.max(DAY_START,snap(DAY_START+(e.clientX-rect.left)/rect.width*SPAN)));
  if(!dropLine){dropLine=document.createElement('div');dropLine.className='dropline';track.appendChild(dropLine);}
  if(dropLine.parentElement!==track)track.appendChild(dropLine);
  dropLine.style.left=pct(m)+'%';
});
boardEl.addEventListener('dragleave',e=>{if(!boardEl.contains(e.relatedTarget))clearDrop();});
boardEl.addEventListener('drop',e=>{
  const track=e.target.closest('.track');clearDrop();
  if(!track||!state.dragId)return;
  e.preventDefault();
  const job=J(state.dragId);
  if(track.dataset.lane==='unassigned'){
    if(job.techId){unassign(job);}return;
  }
  const techId=track.dataset.tech;if(!techId)return;
  const rect=track.getBoundingClientRect();
  const m=Math.min(DAY_END-job.dur,Math.max(DAY_START,snap(DAY_START+(e.clientX-rect.left)/rect.width*SPAN)));
  const res=placeJob(job,techId,m);
  if(!res.ok)toast('err',res.msg,4200);
  renderAll();
});
function clearDrop(){boardEl.querySelectorAll('.track.dropok').forEach(x=>x.classList.remove('dropok'));if(dropLine){dropLine.remove();dropLine=null;}}

function scrollJobIntoView(id){
  if(state.view!=='timeline')return;
  const j=J(id);if(!j||j.start==null)return;
  const track=[...boardEl.querySelectorAll('.track')].find(t=>t.dataset.tech===j.techId);
  if(!track)return;
  const row=track.closest('.brow');row.scrollIntoView({block:'nearest'});
  const w=track.getBoundingClientRect().width;
  scrollEl.scrollLeft=Math.max(0,(pct(j.start)/100)*w-220);
}

/* go */
renderAll();
toast('info','Planning tomorrow — 3 issues detected in the schedule. Review the alert strip.',4600);
</script>
