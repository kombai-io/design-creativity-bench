[project]
name = "design-creativity-bench"
version = "0.1.0"
description = "Design Creativity Bench: measuring creativity in LLM-generated UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "google-genai>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "openai>=1.60",
  "pillow>=10.0",
  "playwright>=1.45",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dcbench"]
